name: Daily report presentation tests

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/daily_email.py"
      - "dashboard/forecast_presentation.py"
      - "tests-python/**"
      - "tests/fixtures/daily-report-2026-11-04/**"
      - ".github/workflows/daily-report-presentation-tests.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/daily_email.py"
      - "dashboard/forecast_presentation.py"
      - "tests-python/**"
      - "tests/fixtures/daily-report-2026-11-04/**"
      - ".github/workflows/daily-report-presentation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: local-requirements.txt

      - name: Install test dependencies
        run: pip install -r local-requirements.txt

      - name: Run complete regression suite
        run: python -m pytest tests-python -q
