name: Daily cloud market report

on:
  repository_dispatch:
    types: [market-thermometer-daily]
  schedule:
    # Low-frequency GitHub fallback at 20:47 Asia/Taipei (12:47 UTC).
    # Primary trigger: external cron-job.org repository_dispatch at 20:13 Taipei.
    - cron: "47 12 * * 1-5"
    # Final checkpoint at 05:00 Asia/Taipei. The resolver targets the previous
    # pending expected session and does not depend on exact scheduler timing.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      run_phase:
        description: "Checkpoint semantics; manual runs still use all safety gates"
        required: true
        default: "FALLBACK"
        type: choice
        options: [PRIMARY, FALLBACK, FINAL]

concurrency:
  group: daily-cloud-market-report
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: local-requirements.txt

      - name: Install Python dependencies
        run: pip install -r local-requirements.txt

      - name: Resolve checkpoint target and guard duplicate publication
        id: daily_guard
        shell: bash
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_RUN_PHASE: ${{ inputs.run_phase }}
        run: python -m dashboard.pipeline_schedule

      - name: Update Google Sheet and send Gmail
        if: steps.daily_guard.outputs.should_run == 'true'
        env:
          FINLAB_REFRESH_TOKEN: ${{ secrets.FINLAB_REFRESH_TOKEN }}
          FINLAB_SESSION_ID: ${{ secrets.FINLAB_SESSION_ID }}
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
          # Deprecated compatibility path; remove after the three new secrets are configured.
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RUN_PHASE: ${{ steps.daily_guard.outputs.run_phase }}
          TARGET_DATA_DATE: ${{ steps.daily_guard.outputs.target_data_date }}
          CALENDAR_REVIEW_ENABLED: ${{ vars.CALENDAR_REVIEW_ENABLED }}
          GOOGLE_SHEET_REVIEW_URL: ${{ secrets.GOOGLE_SHEET_REVIEW_URL }}
        run: python -m dashboard.cloud_daily

      - name: Validate completion manifest
        if: steps.daily_guard.outputs.should_run == 'true'
        run: python -c "from dashboard.run_manifest import validate_manifest; validate_manifest('outputs/run_manifest.json')"

      - name: Validate Work Site publication
        if: steps.daily_guard.outputs.should_run == 'true'
        run: |
          python -m dashboard.work_site_publication validate-status
          python -m dashboard.work_site_publication validate-payload --path public/data/work_site_payload.json

      - name: Publish current Work Site payload to GitHub
        if: steps.daily_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/work_site_payload.json
          if git diff --cached --quiet; then
            echo "Work Site payload is unchanged; no publication commit required."
          else
            data_date="$(python -c "import json; print(json.load(open('public/data/work_site_payload.json'))['provenance']['data_date'])")"
            git commit -m "Publish Work Site payload for ${data_date}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload run audit artifact
        if: always() && steps.daily_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: market-report-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
