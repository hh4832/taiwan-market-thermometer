name: Daily cloud market report

on:
  schedule:
    # GitHub cron使用UTC；12:00 UTC = 台北20:00。
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-cloud-market-report
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r local-requirements.txt
      - name: Update Google Sheet and send Gmail
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m dashboard.cloud_daily
