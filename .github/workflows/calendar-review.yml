name: Calendar exception review

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: calendar-exception-review
  cancel-in-progress: false

jobs:
  process-approved-reviews:
    if: ${{ vars.CALENDAR_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: local-requirements.txt
      - run: pip install -r local-requirements.txt
      - name: Process explicitly approved review events
        env:
          CALENDAR_REVIEW_ENABLED: ${{ vars.CALENDAR_REVIEW_ENABLED }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m dashboard.calendar_review
