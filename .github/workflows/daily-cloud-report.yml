name: Daily cloud market report

on:
  schedule:
    # 12:13 UTC = 20:13 Asia/Taipei.  A single run avoids a green
    # duplicate-guard job that produced no business output.
    - cron: "13 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-cloud-market-report
  cancel-in-progress: false

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: local-requirements.txt

      - name: Install Python dependencies
        run: pip install -r local-requirements.txt

      - name: Update Google Sheet and send Gmail
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m dashboard.cloud_daily

      - name: Validate completion manifest
        run: python -c "from dashboard.run_manifest import validate_manifest; validate_manifest('outputs/run_manifest.json')"

      - name: Upload run audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: market-report-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
